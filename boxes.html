<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visual Testing - Series Boxes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px;
      background-color: #f4f4f4;
    }
    .box {
      width: 200px;
      height: 180px;
      padding: 20px;
      color: #ffffff;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .box1 { background-color: #7f10ef; }
    .box2 { background-color: #24a10b; }
    .box3 { background-color: #48b70e; }
    .box4 { background-color: #e91e63; }
    .box5 { background-color: #ff9800; }
    .box6 { background-color: #3f51b5; }
  </style>
</head>
<body>
  <div class="box box1">Alpha</div>
  <div class="box box2">Bravo</div>
  <div class="box box3">Charlie</div>
  <div class="box box4">Delta</div>
  <div class="box box5">Echo</div>
  <div class="box box6">Foxtrot</div>
</body>
</html>
