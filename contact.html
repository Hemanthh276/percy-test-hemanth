<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisualCo — Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>VisualCo</h1>
    <nav class="nav">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/features.html" class="nav-link">Features</a>
      <a href="/pricing.html" class="nav-link">Pricing</a>
      <a href="/about.html" class="nav-link">About</a>
      <a href="/contact.html" class="nav-link">Contact</a>
    </nav>
  </header>

  <main class="content">
    <h2 class="page-title">Contact us</h2>
    <p class="page-subtitle">We'd love to hear from you. Send us a message.</p>
    <form class="form">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com">
      <label for="message">Message</label>
      <textarea id="message" placeholder="How can we help?"></textarea>
      <button class="cta-button" type="button" style="margin-top:20px;">Send Message</button>
    </form>
  </main>

  <footer class="footer">© 2026 VisualCo. All rights reserved.</footer>
</body>
</html>
